# Aucun config file n'existait avant (build Netlify tournait sur ses
# valeurs par défaut, dont Node 18.20.8). Or Next.js 16 exige Node >= 20.9.0
# (message d'erreur exact du build, log Netlify du 20/08/2026 : "You are
# using Node.js 18.20.8. For Next.js, Node.js version '>=20.9.0' is
# required."). Depuis quand ce mismatch bloque le build : pas déterminé
# précisément (pas vérifié l'historique des runs Netlify). Simple constat :
# c'est la cause du dernier échec en date. NODE_VERSION ici en plus de
# .nvmrc (belt and suspenders) : Netlify lit les deux, autant ne pas
# dépendre d'un seul mécanisme.
[build]
  # 31/08 : migration npm -> pnpm. Netlify autodetecte le manager
  # depuis pnpm-lock.yaml, mais on declare explicitement pour eviter
  # tout doute (defensive) et beneficier de la version pinnee via le
  # champ packageManager de package.json (Corepack).
  command = "pnpm run build"

  # NE PAS RECONSTRUIRE POUR RIEN (14/09, demande de Sylvain : « je risque
  # d'etre facture car je push trop »). Netlify reconstruit a CHAQUE
  # poussee sur la branche de production, et le compte gratuit donne 300
  # minutes de construction par mois. Le rythme de ce depot est de vingt a
  # cinquante commits par jour : a deux minutes la construction, cela
  # depasse l'enveloppe mensuelle en moins d'une semaine.
  #
  # `ignore` est une commande : code 0 = on saute la construction, code
  # different de 0 = on construit. Ici on saute quand la difference entre
  # le dernier commit construit et celui-ci ne touche QUE de la
  # documentation, des tests ou des brouillons : rien de tout cela n'est
  # servi au visiteur.
  #
  # LES TROIS GARDES EN TETE, ET POURQUOI ELLES SONT LA (29/10). Cette
  # ligne portait avant un commentaire FAUX : « si la variable de commit
  # cachee manque, la commande echoue, donc on construit : le defaut est du
  # bon cote ». Le defaut etait du MAUVAIS cote. Le 28/10, `main` est passe
  # de b7d3944 a f344ec7 (51 fichiers, dont douze de src/) et Netlify a
  # ANNULE le deploiement : « Canceled build due to no content change ».
  # Le site a servi la version du 10/10 pendant une demi-heure, en silence.
  # Cause : `git diff --quiet $CACHED $COMMIT` avec $CACHED VIDE n'a plus
  # qu'une reference, compare donc l'arbre de travail a ce commit, ne
  # trouve rien sur une copie propre, et renvoie 0 -- on saute. Deux
  # references identiques font pareil.
  # D'ou : on exige que les deux references existent et soient
  # differentes AVANT de comparer. Toute garde qui tombe rend un code non
  # nul, donc construit : deux minutes de construction valent mieux qu'un
  # site qui reste en arriere sans bruit.
  #
  # Aucune guillemet double ici, et ce n'est pas un hasard : la valeur TOML
  # en est delimitee, et les echapper rendrait la commande illisible pour
  # qui la relit (et pour son oracle). `${#VAR}` donne une longueur, donc
  # pas besoin de proteger la variable ; une fois les deux refs connues non
  # vides, ce sont des sommes de controle sans espace.
  #
  # Son oracle : tests/harnais/netlify-ignore.test.ts, qui lit CETTE ligne
  # dans ce fichier et la lance sur de vrais couples de commits du depot.
  ignore = "[ ${#CACHED_COMMIT_REF} -gt 0 ] && [ ${#COMMIT_REF} -gt 0 ] && [ $CACHED_COMMIT_REF != $COMMIT_REF ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':(exclude)docs/**' ':(exclude)tests/**' ':(exclude).scratch/**' ':(exclude)*.md'"

# LES BRANCHES NE CONSTRUISENT JAMAIS (14/09). Le travail vit desormais sur
# `dev` et ne rejoint `main` que lorsqu'il y a quelque chose a montrer. Ces
# deux gardes valent meme si les deploiements de branche ou les apercus de
# fusion sont actives dans l'interface : un code 0 saute toujours.
[context.branch-deploy]
  ignore = "exit 0"

[context.deploy-preview]
  ignore = "exit 0"

[build.environment]
  # 28/08 : 20 → 22 (retour Netlify UI "Agent Runners work best with
  # Node.js 22 or higher"). Node 22 est le LTS courant, requis par
  # les runners recents. Aligne sur .nvmrc.
  NODE_VERSION = "22"
  # 31/08 : Netlify auto-detecte pnpm via pnpm-lock.yaml + version
  # pinnee via le champ packageManager de package.json (Corepack).
  # Aucun env var supplementaire necessaire.

# LES EN-TETES (13/09, X14 de l'audit). Aucun n'etait pose ; Netlify n'en
# met pas par defaut. Pas de Content-Security-Policy ici : Next injecte des
# scripts en ligne et la scene charge des modeles et des polices du meme
# domaine ; une CSP se pose avec un nonce, chantier a part. Ceux-ci ne
# cassent rien et ferment les portes evidentes.
# LE CACHE DES RESSOURCES LOURDES (16/09). Elles etaient servies en
# `max-age=0`, donc revalidees a chaque usage, y compris a l'interieur d'une
# meme visite : un modele deja telecharge repartait en aller-retour a chaque
# navigation cardinale. C'est aussi ce qui rendait la prelecture douce a
# moitie inutile (voir mount-for-direction.prelectureDouce).
#
# UNE JOURNEE, ET PAS `immutable`, parce que ces fichiers ne portent pas
# d'empreinte dans leur nom : `xolotl.glb` reste `xolotl.glb` d'un deploiement
# a l'autre. `immutable` figerait un modele remplace pour un an chez les
# visiteurs revenus. Une journee de fraicheur et une semaine de
# `stale-while-revalidate` donnent le gain sans le piege : un nouveau modele
# arrive au plus tard le lendemain, et entre-temps le visiteur voit l'ancien
# pendant que le nouveau descend en fond.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/sky/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/env/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
